# Values for gemma3-vllm
replicaCount: 0  # Scale to zero when idle

image:
  repository: vllm/vllm-openai
  pullPolicy: IfNotPresent
  tag: "latest"

model:
  name: "google/gemma-3-27b"
  size: "27B"
  tier: "gemma3"
  backend: "vllm"
  gpuCount: 1

service:
  type: ClusterIP
  port: 8000
  targetPort: 8000

resources:
  requests:
    nvidia.com/gpu: 1
    memory: 40Gi
  limits:
    nvidia.com/gpu: 1
    memory: 40Gi

persistence:
  enabled: true
  storageClass: "local-path"
  size: 100Gi
  mountPath: /models

autoscaling:
  enabled: true
  minReplicas: 0
  maxReplicas: 2
  targetCPUUtilizationPercentage: 70

nodeSelector: {}
tolerations: []
affinity: {}
