# Optional for developers; mirrors the CI lint job: pip install -e ".[dev]" && pre-commit install
# The hooks never touch the released data, the committed outputs in results/ (CRLF CSVs, figures and traces)
# or the goldens in tests/golden/.
exclude: ^(data|results|tests/golden)/

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.10
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
        # The Helm templates are Go templates, not plain YAML.
        exclude: ^deploy/helm/.*/templates/
      - id: check-toml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-added-large-files
